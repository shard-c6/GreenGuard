name: Bug report
description: Something behaves incorrectly
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check [AUDIT_AND_ROADMAP.md](../blob/main/docs/AUDIT_AND_ROADMAP.md) —
        many known defects are already catalogued there with file references.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, database, ml, devops, geo/mapping, docs]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Include the file and line if you know it (e.g. `src/foo.ts:42`).
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations: {required: true}
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "P0 — platform broken or unsafe for users"
        - "P1 — blocks production readiness"
        - "P2 — important, not blocking"
        - "P3 — minor"
    validations: {required: true}
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This bug could cause the platform to show a user incorrect plant, health, or treatment information
