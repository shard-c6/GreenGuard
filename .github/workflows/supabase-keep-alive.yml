name: Supabase Keep-Alive

# The previous version pinged every 3 days without --fail, so a failed ping
# looked identical to a successful one. A paused project rejects the ping, so
# once paused this workflow could never recover it — and told nobody.
# That is exactly how the platform ended up dead. See #199.

on:
  schedule:
    - cron: '0 3 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write           # needed to raise the alarm

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        id: ping
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      # Alerting runs through github-script rather than the gh CLI: the CLI step
      # failed silently in CI for four consecutive days, so the workflow detected
      # the outage and told nobody. An alerting path that can itself fail is worse
      # than no alerting, because it looks like everything is fine.
      - name: Open an issue if the ping failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Supabase unreachable — keep-alive ping failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The daily Supabase keep-alive ping failed.",
              "",
              "**Check in this order:**",
              "1. `SUPABASE_URL` and `SUPABASE_ANON_KEY` repository secrets — an HTTP 401 means the key is wrong or stale, not that the project is paused.",
              "2. Whether the project has paused. A paused project rejects the ping, so this keeps failing until someone restores it from the dashboard.",
              "",
              "Runbook: `docs/PHASE0_PLAN.md` step S1.",
              "",
              `Run: ${run}`
            ].join("\n");

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "incident", per_page: 50
            });
            const existing = open.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
              core.notice(`Commented on existing incident #${existing.number}`);
            } else {
              const { data: made } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["incident", "priority/P0", "area/database"],
                assignees: ["rahulcodes-java"]
              });
              core.notice(`Opened incident #${made.number}`);
            }
