name: Supabase Keep-Alive

# The previous version pinged every 3 days without --fail, so a failed ping
# looked identical to a successful one. A paused project rejects the ping, so
# once paused this workflow could never recover it — and told nobody.
# That is exactly how the platform ended up dead. See #199.

on:
  schedule:
    - cron: '0 3 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write           # needed to raise the alarm

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        id: ping
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Open an issue if the ping failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Avoid piling up duplicates — reuse the open alert if one exists.
          existing=$(gh issue list --label "incident" --state open \
                       --search "Supabase unreachable in:title" \
                       --json number --jq '.[0].number')
          body="The daily Supabase keep-alive ping failed.

          **Most likely cause:** the project has paused. A paused project rejects
          the ping, so this will keep failing until someone restores it from the
          dashboard.

          Runbook: \`docs/PHASE0_PLAN.md\` step S1.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "Supabase unreachable — keep-alive ping failed" \
              --label "incident,priority/P0,area/database" \
              --assignee "rahulcodes-java" \
              --body "$body"
          fi
