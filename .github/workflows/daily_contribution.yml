name: Daily Contribution Streak

on:
  schedule:
    - cron: '0 6 * * *' # Runs at 11:30 IST (06:00 UTC) every day
  workflow_dispatch: # Allows manual triggering

jobs:
  maintain-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Shardul Chogale"
          git config --global user.email "144150911+shard-c6@users.noreply.github.com"

      - name: Run Maintain Streak Script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/maintain_streak.sh
          ./scripts/maintain_streak.sh
